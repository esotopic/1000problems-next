<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#1a1a2e"/>
  <defs>
    <linearGradient id="gstack-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="50%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <!-- Stacked layers representing the "stack" -->
  <g transform="translate(80, 40)">
    <rect x="0" y="0" width="80" height="16" rx="4" fill="#0f3460" opacity="0.5"/>
    <rect x="-10" y="22" width="100" height="16" rx="4" fill="#0f3460" opacity="0.65"/>
    <rect x="-20" y="44" width="120" height="16" rx="4" fill="#0f3460" opacity="0.8"/>
    <rect x="-30" y="66" width="140" height="16" rx="4" fill="url(#gstack-grad)"/>
    <rect x="-20" y="88" width="120" height="16" rx="4" fill="#0f3460" opacity="0.8"/>
    <rect x="-10" y="110" width="100" height="16" rx="4" fill="#0f3460" opacity="0.65"/>
    <rect x="0" y="132" width="80" height="16" rx="4" fill="#0f3460" opacity="0.5"/>
  </g>
  <!-- G letter -->
  <text x="195" y="130" font-family="monospace" font-size="72" font-weight="bold" fill="url(#text-grad)">G</text>
  <!-- STACK text -->
  <text x="195" y="175" font-family="monospace" font-size="36" font-weight="bold" fill="#a8b2d1" letter-spacing="8">STACK</text>
  <!-- Subtitle -->
  <text x="200" y="205" font-family="sans-serif" font-size="13" fill="#6272a4" text-anchor="middle">AI Software Factory — Deep Dive</text>
</svg>
